## TEMPLATE — do NOT commit real secrets. Generate via External Secrets / Vault / cloud KMS.
##
## Each value is base64-encoded. Generate keys with:
##   python -c "import secrets; print(secrets.token_urlsafe(48))"           # SECRET_KEY
##   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"  # MFA_ENCRYPTION_KEY
##
## In real deployments use:
##   - AWS Secrets Manager + External Secrets Operator
##   - Azure Key Vault + Secrets Store CSI Driver
##   - HashiCorp Vault + Vault Agent / Vault Sidecar
##   - GCP Secret Manager + Workload Identity
apiVersion: v1
kind: Secret
metadata:
  name: cm-secrets
  namespace: contract-management
type: Opaque
stringData:
  SECRET_KEY: "REPLACE-with-32+byte-random-string"
  MFA_ENCRYPTION_KEYS: |
    REPLACE-with-Fernet-key-line-1
    # additional keys (older, kept for read-side rotation) go on subsequent lines
  DATABASE_URL: "postgresql+psycopg2://cm:REPLACE@cm-postgres:5432/cm?sslmode=require"
  REDIS_URL: "redis://cm-redis:6379/0"
  S3_BUCKET: "cm-files-prod"
  S3_ENDPOINT_URL: ""                           # leave empty for AWS native
  S3_ACCESS_KEY: ""                             # prefer IRSA/Workload Identity over keys
  S3_SECRET_KEY: ""
  S3_REGION: "us-east-1"
  SMTP_HOST: "smtp.sendgrid.net"
  SMTP_PORT: "587"
  SMTP_USER: "apikey"
  SMTP_PASSWORD: "REPLACE"
