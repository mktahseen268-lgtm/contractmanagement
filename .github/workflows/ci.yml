name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write     # for OIDC cloud auth on deploy

env:
  PY_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:

  # ---------------------------------------------------------------------- lint + type check
  lint:
    name: Lint + Type
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PY_VERSION }}" }
      - run: pip install ruff==0.6.9 mypy==1.11.2
      - run: ruff check apps/api/app
      - run: cd apps/api && mypy --ignore-missing-imports app || true   # ratchet to strict over time
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "npm", cache-dependency-path: apps/web/package-lock.json }
      - run: cd apps/web && npm ci
      - run: cd apps/web && npm run lint --if-present
      # Web build also acts as a TS type-check
      - run: cd apps/web && npx next build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"

  # ---------------------------------------------------------------------- backend tests
  test-api:
    name: Pytest (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: cm, POSTGRES_PASSWORD: cm, POSTGRES_DB: cm }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: "postgresql+psycopg2://cm:cm@localhost:5432/cm"
      REDIS_URL: "redis://localhost:6379/0"
      AUTO_SEED: "false"
      RUN_MIGRATIONS_ON_STARTUP: "true"
      CELERY_TASK_ALWAYS_EAGER: "true"
      EMAIL_BACKEND: "console"
      STORAGE_BACKEND: "local"
      ENV: "test"
      SECRET_KEY: "ci-test-secret-key-32-bytes-long-aaaaaa"
      MFA_ENCRYPTION_KEYS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PY_VERSION }}", cache: "pip", cache-dependency-path: apps/api/requirements.txt }
      - run: pip install -r apps/api/requirements.txt
      - run: pip install pytest pytest-cov httpx
      # The test suite is currently the throwaway smoke scripts; ratchet to a real pytest run.
      - run: cd apps/api && python -c "from app.main import app; print('import ok')"

  # ---------------------------------------------------------------------- SAST + secrets
  sast:
    name: SAST (bandit + semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PY_VERSION }}" }
      - run: pip install bandit==1.7.10 semgrep==1.85.0
      - run: bandit -r apps/api/app -lll -x apps/api/app/seed.py
      - run: semgrep --config=p/owasp-top-ten --error --severity=ERROR --severity=WARNING apps/api/app apps/web/src

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ""  # community
        with:
          config-path: .gitleaks.toml
          fail: "true"

  # ---------------------------------------------------------------------- dependency audit
  deps-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PY_VERSION }}" }
      - run: pip install pip-audit==2.7.3 safety==3.2.7
      - run: pip-audit --disable-pip --requirement apps/api/requirements.txt || true
      - run: safety check -r apps/api/requirements.txt || true   # ratchet to fail-on after baseline
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "npm", cache-dependency-path: apps/web/package-lock.json }
      - run: cd apps/web && npm audit --audit-level=high || true

  # ---------------------------------------------------------------------- container build + scan
  build-image:
    name: Container build + Trivy
    runs-on: ubuntu-latest
    needs: [lint, test-api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image (no push on PR)
        run: |
          docker buildx build \
            --file apps/api/Dockerfile \
            --tag cm-api:ci \
            --load \
            apps/api
      - name: Trivy scan (HIGH/CRITICAL fail)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "cm-api:ci"
          severity: "HIGH,CRITICAL"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true

  # ---------------------------------------------------------------------- summary gate
  gate:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [lint, test-api, sast, secrets-scan, deps-audit, build-image]
    steps:
      - run: echo "CI green."
