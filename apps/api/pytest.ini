[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --strict-config -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:pyotp.*
markers =
    postgres: requires a real PostgreSQL database (skipped on SQLite)
    mssql: requires a real SQL Server database (skipped otherwise)
    oracle: requires a real Oracle database (skipped otherwise)
    hsm: requires a PKCS#11 token (SoftHSM2 in CI); skipped unless HSM_LIBRARY_PATH is set
    slow: marks tests as slow
