[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --strict-config -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:pyotp.*
markers =
    postgres: requires a real PostgreSQL database (skipped on SQLite)
    slow: marks tests as slow
